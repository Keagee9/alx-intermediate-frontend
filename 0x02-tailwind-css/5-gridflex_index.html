<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid and Flexbox Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="p-4 font-sans antialiased text-gray-800 bg-gray-50">
    <header class="bg-blue-500 text-white p-4 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold">Grid and Flexbox Layout</h1>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4 min-h-screen">
        <section class="lg:col-span-2 flex flex-col lg:flex-row gap-4 p-4 rounded-lg shadow-md bg-white">
            <div class="p-4 bg-red-200 w-full lg:w-1/2 rounded-lg shadow-sm flex items-center justify-center h-32 text-lg font-semibold">Flexbox Item 1</div>
            <div class="p-4 bg-red-400 w-full lg:w-1/2 rounded-lg shadow-sm flex items-center justify-center h-32 text-lg font-semibold text-white">Flexbox Item 2</div>
        </section>

        <aside class="bg-green-200 p-4 rounded-lg shadow-md flex items-center justify-center h-48 text-lg font-semibold">Sidebar</aside>
    </main>

    <footer class="bg-gray-800 text-white p-4 mt-4 rounded-lg shadow-md text-center">
        <p>&copy; 2024 John Doe's Blog</p>
    </footer>
</body>
</html>
