<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid and Flexbox Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
            .image-gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="p-4 font-sans antialiased text-gray-800 bg-gray-50">
    <header class="bg-blue-500 text-white p-4 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold">Grid and Flexbox Layout</h1>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4 min-h-screen">
        <section class="lg:col-span-2 flex flex-col lg:flex-row gap-4 p-4 rounded-lg shadow-md bg-white">
            <div class="p-4 bg-red-200 w-full lg:w-1/2 rounded-lg shadow-sm flex items-center justify-center h-32 text-lg font-semibold">Flexbox Item 1</div>
            <div class="p-4 bg-red-400 w-full lg:w-1/2 rounded-lg shadow-sm flex items-center justify-center h-32 text-lg font-semibold text-white">Flexbox Item 2</div>
        </section>

        <aside class="bg-green-200 p-4 rounded-lg shadow-md flex items-center justify-center h-48 text-lg font-semibold">Sidebar</aside>
    </main>

    <section class="max-w-6xl mx-auto mt-8 p-6 bg-white rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold text-gray-700 mb-6 text-center">Responsive Image Gallery</h2>
        <div class="image-gallery grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="rounded-lg overflow-hidden shadow-md">
                <img src="https://placehold.co/600x400/FF5A5F/FFFFFF?text=Image+1" alt="Gallery Image 1" class="w-full h-auto object-cover">
            </div>
            <div class="rounded-lg overflow-hidden shadow-md">
                <img src="https://placehold.co/600x400/008489/FFFFFF?text=Image+2" alt="Gallery Image 2" class="w-full h-auto object-cover">
            </div>
            <div class="rounded-lg overflow-hidden shadow-md">
                <img src="https://placehold.co/600x400/222222/FFFFFF?text=Image+3" alt="Gallery Image 3" class="w-full h-auto object-cover">
            </div>
            <div class="rounded-lg overflow-hidden shadow-md">
                <img src="https://placehold.co/600x400/717171/FFFFFF?text=Image+4" alt="Gallery Image 4" class="w-full h-auto object-cover">
            </div>
            <div class="rounded-lg overflow-hidden shadow-md">
                <img src="https://placehold.co/600x400/FF5A5F/FFFFFF?text=Image+5" alt="Gallery Image 5" class="w-full h-auto object-cover">
            </div>
            <div class="rounded-lg overflow-hidden shadow-md">
                <img src="https://placehold.co/600x400/008489/FFFFFF?text=Image+6" alt="Gallery Image 6" class="w-full h-auto object-cover">
            </div>
        </div>
    </section>

    <footer class="bg-gray-800 text-white p-4 mt-8 rounded-lg shadow-md text-center">
        <p>&copy; 2024 John Doe's Blog</p>
    </footer>
</body>
</html>
