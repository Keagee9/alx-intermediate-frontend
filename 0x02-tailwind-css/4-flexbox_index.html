<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flexbox Layout</title>
    <style>
      @media (max-width: 768px) {
          main {
              flex-direction: column;
          }
          main aside,
          main section {
              width: 100%;
          }
      }
    </style>
</head>
<body class="p-4 font-sans antialiased text-gray-800 bg-gray-50">
    <header class="mb-4 text-center">
        <h1 class="text-3xl text-red-700 font-bold">Responsive Flexbox Layout</h1>
    </header>

    <main class="flex gap-4 max-w-4xl mx-auto">
        <aside class="w-1/3 bg-gray-300 p-4 rounded-lg shadow-md flex items-center justify-center h-48">
            <p class="text-lg font-semibold">Sidebar</p>
        </aside>

        <section class="w-2/3 bg-gray-500 p-4 rounded-lg shadow-md flex items-center justify-center h-48 text-white">
            <p class="text-lg font-semibold">Content Section</p>
        </section>
    </main>

    <script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
